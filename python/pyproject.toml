[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "indykite-delegated-token"
description = "IndyKite delegated token propagation for AI agents and MCP servers"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
version = "0.0.0"
authors = [
    { name = "IndyKite", email = "develop@indykite.com" },
]
keywords = ["indykite", "delegated-token", "token-propagation", "a2a", "mcp", "agents"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# MCP Python SDK 2.x: MCPServer, and the httpx2 client
mcp = ["mcp>=2.3", "httpx2>=2.10"]
# MCP Python SDK 1.x: FastMCP and the httpx client
mcp1 = ["mcp>=1.30,<2", "httpx>=0.28"]
# FastMCP 4
fastmcp = ["fastmcp>=4", "httpx2>=2.10"]
# A2A Python SDK
a2a = ["a2a-sdk>=1.3", "httpx>=0.28"]

[project.urls]
Homepage = "https://github.com/indykite/indykite-delegated-token"
Source = "https://github.com/indykite/indykite-delegated-token/tree/master/python"
"Developer Guides" = "https://developer.indykite.com"
Changelog = "https://github.com/indykite/indykite-delegated-token/blob/master/python/CHANGELOG.md"

[dependency-groups]
dev = [
    "anyio",
    "bandit[toml]",
    "httpx",
    "httpx2",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "starlette",
    "uvicorn",
]
# mcp 1.x and 2.x share the import name `mcp`, so the tests of each run in their own environment, see [tool.uv]
mcp1 = [
    "a2a-sdk[http-server]>=1.3",
    "mcp>=1.30,<2",
]
mcp2 = [
    "a2a-sdk[http-server]>=1.3",
    "fastmcp>=4",
    "mcp>=2.3",
]

[tool.uv]
# `uv run pytest` tests against mcp 2.x; `uv run --no-group mcp2 --group mcp1 pytest` against mcp 1.x
default-groups = ["dev", "mcp2"]
conflicts = [
    [{ group = "mcp1" }, { group = "mcp2" }],
    [{ extra = "mcp1" }, { extra = "mcp" }],
    [{ extra = "mcp1" }, { extra = "fastmcp" }],
    [{ extra = "mcp1" }, { group = "mcp2" }],
    [{ extra = "mcp" }, { group = "mcp1" }],
    [{ extra = "fastmcp" }, { group = "mcp1" }],
]

[tool.setuptools.packages.find]
include = ["indykite_delegated_token*"]

[tool.setuptools.package-data]
indykite_delegated_token = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["indykite_delegated_token"]
omit = [
    "tests/*",
]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["indykite_delegated_token", "tests"]

[[tool.mypy.overrides]]
# the tests register tools through the untyped decorators of the SDKs
module = ["_harness", "test_install", "test_propagation"]
disallow_untyped_decorators = false

#
# 'ruff' - the linter and formatter
# https://github.com/astral-sh/ruff
[tool.ruff]
target-version = 'py311'
line-length = 120

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # flake8-annotations
    "ANN",
]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["ANN"]
# the tests drive the MCP and A2A SDKs of either major version, whose objects they handle dynamically
"tests/**" = ["ANN401"]

[tool.ruff.format]
quote-style = 'double'

#
# 'bandit' config section
# https://bandit.readthedocs.io/en/latest/config.html
#
[tool.bandit]
exclude_dirs = ['tests', '.venv']
