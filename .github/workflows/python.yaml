---
name: Python

on: # yamllint disable-line rule:truthy
  # called by 'ci.yaml' when files of the Python package changed
  workflow_call: {}

permissions:
  contents: read

defaults:
  run:
    working-directory: python

jobs:
  lint:
    name: Lint (${{ matrix.sdk }})
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false
      matrix:
        # mcp 1.x and 2.x share the import name `mcp`, so each adapter is type checked in its own environment
        include:
          - sdk: mcp1
            mypy-exclude: server/(mcp_v2|fastmcp)\.py
          - sdk: mcp2
            mypy-exclude: server/mcp_v1\.py
    steps:
      - name: actions/checkout
        uses: indykite/.github/.github/actions/git-checkout@master # actions/checkout with dynamic fetch-depth resolution

      - name: setup/uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3 - https://github.com/astral-sh/setup-uv/releases
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group dev --group ${{ matrix.sdk }}

      - name: ruff check
        if: matrix.sdk == 'mcp2'
        run: uv run --no-sync ruff check --output-format=github

      - name: ruff format
        if: matrix.sdk == 'mcp2'
        run: uv run --no-sync ruff format --check

      - name: mypy
        env:
          MYPY_EXCLUDE: ${{ matrix.mypy-exclude }}
        run: uv run --no-sync mypy --follow-imports=silent --exclude "$MYPY_EXCLUDE"

      - name: bandit
        if: matrix.sdk == 'mcp2'
        run: uv run --no-sync bandit -c pyproject.toml -r .

  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.sdk }})
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # mcp 1.x and 2.x share the import name `mcp`; the tests of the other one are skipped
        sdk: [mcp1, mcp2]
    steps:
      - name: actions/checkout
        uses: indykite/.github/.github/actions/git-checkout@master # actions/checkout with dynamic fetch-depth resolution

      - name: setup/uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3 - https://github.com/astral-sh/setup-uv/releases
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group dev --group ${{ matrix.sdk }}

      - name: Run unit tests
        run: uv run --no-sync pytest --cov --cov-report xml

      - name: Build package
        if: matrix.sdk == 'mcp2'
        run: uv build

      - name: codecov/upload-coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1 - https://github.com/codecov/codecov-action/releases
        if: matrix.python-version == '3.14'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: python
          files: python/coverage.xml
