---
name: Python

on: # yamllint disable-line rule:truthy
  # called by 'ci.yaml' when files of the Python package changed
  workflow_call: {}

permissions:
  contents: read

defaults:
  run:
    working-directory: python

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-slim
    steps:
      - name: actions/checkout
        uses: indykite/.github/.github/actions/git-checkout@master # actions/checkout with dynamic fetch-depth resolution

      - name: setup/uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3 - https://github.com/astral-sh/setup-uv/releases
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check --output-format=github

      - name: ruff format
        run: uv run ruff format --check

      - name: mypy
        run: uv run mypy

      - name: bandit
        run: uv run bandit -c pyproject.toml -r .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: actions/checkout
        uses: indykite/.github/.github/actions/git-checkout@master # actions/checkout with dynamic fetch-depth resolution

      - name: setup/uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3 - https://github.com/astral-sh/setup-uv/releases
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Run unit tests
        run: uv run pytest --cov --cov-report xml

      - name: Build package
        run: uv build

      - name: codecov/upload-coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1 - https://github.com/codecov/codecov-action/releases
        if: matrix.python-version == '3.14'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: python
          files: python/coverage.xml
