---
name: TypeScript

on: # yamllint disable-line rule:truthy
  # called by 'ci.yaml' when files of the TypeScript package changed
  workflow_call: {}

permissions:
  contents: read

defaults:
  run:
    working-directory: typescript

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-slim
    steps:
      - name: actions/checkout
        uses: indykite/.github/.github/actions/git-checkout@master # actions/checkout with dynamic fetch-depth resolution

      - name: setup/pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 - https://github.com/pnpm/action-setup/releases
        with:
          package_json_file: typescript/package.json

      - name: setup/node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 - https://github.com/actions/setup-node/releases
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: typescript/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: eslint
        run: pnpm lint

      - name: prettier
        run: pnpm format:check

      - name: tsc
        run: pnpm typecheck

  test:
    name: Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24", "26"]
    steps:
      - name: actions/checkout
        uses: indykite/.github/.github/actions/git-checkout@master # actions/checkout with dynamic fetch-depth resolution

      - name: setup/pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 - https://github.com/pnpm/action-setup/releases
        with:
          package_json_file: typescript/package.json

      - name: setup/node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 - https://github.com/actions/setup-node/releases
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
          cache-dependency-path: typescript/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:coverage

      - name: Build package
        run: pnpm build && pnpm pack --dry-run

      - name: codecov/upload-coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1 - https://github.com/codecov/codecov-action/releases
        if: matrix.node-version == '24'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: typescript
          files: typescript/coverage/lcov.info
