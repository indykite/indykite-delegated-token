# https://docs.deepsource.com/docs/dashboard/repository/.deepsource.toml
version = 1

test_patterns = ["python/tests/**", "typescript/test/**"]

#
[[analyzers]]
name = "secrets"
enabled = true

#
[[analyzers]]
name = "python"
enabled = true
dependency_file_paths = ["python/pyproject.toml"]

  [analyzers.meta]
  runtime_version = "3.x.x"
  max_line_length = 120
  skip_doc_coverage = ["module", "magic", "init", "class", "nonpublic"]

#
[[analyzers]]
name = "javascript"
enabled = true
dependency_file_paths = ["typescript/package.json"]

  [analyzers.meta]
  plugins = []
  environment = ["nodejs"]
  dialect = "typescript"

#
[[transformers]]
name = "ruff"
enabled = true

[[transformers]]
name = "prettier"
enabled = true
